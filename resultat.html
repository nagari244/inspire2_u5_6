<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Résultat · Inspire 3</title>
<style>
:root{--ink:#1e2330;--muted:#5b6274;--line:#e2e5eb;--accent:#2f4b8f;--ok:#1f6b45;--ko:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.stripe{display:flex;height:6px}.stripe i{flex:1}
main{max-width:640px;margin:0 auto;padding:24px 16px 40px}
.kicker{margin:0;font-size:.82rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h1{margin:4px 0 2px;font-size:1.45rem;line-height:1.25}
.nom{font-size:1.2rem;font-weight:700;margin:14px 0 0}
.date{color:var(--muted);margin:2px 0 14px;font-size:.95rem}
.total{font-size:2.2rem;font-weight:800;color:var(--accent);margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:.95rem;margin:10px 0}
td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top}
td:last-child{text-align:right;white-space:nowrap;font-weight:700}
.controle{display:inline-block;border-radius:8px;padding:6px 10px;font-size:.9rem;font-weight:600;margin-top:8px}
.controle.ok{background:#eef6f1;color:var(--ok)}
.controle.ko{background:#fcecea;color:var(--ko)}
.vide{color:var(--muted)}
footer{max-width:640px;margin:0 auto;padding:14px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<div class="stripe" aria-hidden="true"><i style="background:#6b2c91"></i><i style="background:#0b6fb8"></i><i style="background:#2f9b48"></i><i style="background:#f2a900"></i><i style="background:#d22630"></i></div>
<main id="zone">
  <p class="kicker">Résultat d'activité</p>
  <h1>Aucun résultat à afficher</h1>
  <p class="vide">Cette page affiche le résultat qu'un étudiant a remis depuis une activité (bouton « Remettre dans Classroom » ou « Envoyer par courriel »).</p>
  <p><a href="index.html">← Toutes les activités</a></p>
</main>
<footer>Inspire 3 · Unités 5 et 6 · Conception pédagogique : Nadia Aguilar Neri</footer>
<script src="partage.js"></script>
<script>
(function () {
  function decode(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var h = location.hash.slice(1); if (!h) return;
  var o; try { o = JSON.parse(decode(h)); } catch (e) { return; }
  var c = o.c; delete o.c;
  var valide = c === Partage.code(JSON.stringify(o));
  var d = new Date(o.d);
  document.title = "Résultat · " + o.n;
  document.getElementById("zone").innerHTML =
    '<p class="kicker">Résultat d\'activité</p>' +
    "<h1>" + esc(o.a) + "</h1>" +
    '<p class="nom">' + esc(o.n) + "</p>" +
    '<p class="date">Le ' + d.toLocaleDateString("fr-FR") + " à " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) + "</p>" +
    '<p class="total">' + o.p + " / " + o.m + "</p>" +
    "<p class=\"vide\">Points du premier essai de chaque exercice.</p>" +
    "<table>" + o.l.map(function (x) { return "<tr><td>" + esc(x[0]) + "</td><td>" + (x[1] === null ? "—" : x[1]) + " / " + x[2] + "</td></tr>"; }).join("") + "</table>" +
    '<p class="controle ' + (valide ? "ok" : "ko") + '">' + (valide ? "✓ Code de contrôle valide : " + esc(c) : "⚠ Le lien a été modifié : ce résultat n'est pas fiable.") + "</p>";
})();
</script>
</body>
</html>
